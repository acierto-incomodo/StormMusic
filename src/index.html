<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StormMusic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="custom-titlebar">
    <div class="titlebar-drag-zone">StormMusic</div>
    <div class="titlebar-controls">
      <button id="win-min" class="win-btn">⚊</button>
      <button id="win-max" class="win-btn">🗖</button>
      <button id="win-close" class="win-btn close-btn">✕</button>
    </div>
  </div>

  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">StormMusic</div>
      <nav class="menu">
        <h3>Fuentes de Música</h3>
        <ul id="sources-list">
          </ul>
      </nav>
      <div class="sidebar-footer">
        <button id="btn-view-manage-sources" class="nav-btn">📝 Editar Fuentes</button>
        <button id="btn-view-settings" class="nav-btn">⚙️ Ajustes y Update</button>
      </div>
    </aside>

    <main class="main-content">
      
      <section id="view-tracks" class="view">
        <h1 id="source-title">Cargando...</h1>
        <div class="table-container">
          <table class="tracks-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Título</th>
              </tr>
            </thead>
            <tbody id="tracks-body"></tbody>
          </table>
        </div>
      </section>

      <section id="view-manage-sources" class="view hidden">
        <div class="view-header">
          <h1>Gestión de Fuentes</h1>
          <button id="btn-trigger-add" class="apple-btn-primary">➕ Añadir Nueva Fuente</button>
        </div>
        <div class="cards-grid" id="sources-cards-container">
          </div>
      </section>

      <section id="view-source-form" class="view hidden">
        <h1 id="form-view-title">Añadir Nueva Fuente</h1>
        <form id="form-source" class="apple-form">
          <div class="form-group">
            <label>Título de la Fuente</label>
            <input type="text" id="input-title" required placeholder="Ej. Mi Servidor Remoto">
          </div>
          <div class="form-group">
            <label>URL de Music Files (JSON)</label>
            <input type="url" id="input-files" required placeholder="https://ejemplo.com/files.json">
          </div>
          <div class="form-group">
            <label>URL de Music Directory (JSON)</label>
            <input type="url" id="input-directory" required placeholder="https://ejemplo.com/dir.json">
          </div>
          <div class="form-buttons">
            <button type="submit" id="btn-form-submit" class="apple-btn-primary">Guardar Fuente</button>
            <button type="button" id="btn-form-cancel" class="apple-btn">Cancelar</button>
          </div>
        </form>
      </section>

      <section id="view-settings" class="view hidden">
        <h1>Ajustes de StormMusic</h1>
        
        <div class="settings-card">
          <h3>Apariencia</h3>
          <button id="btn-toggle-theme" class="apple-btn">Cambiar a Modo Claro</button>
        </div>

        <div class="settings-card">
          <h3>Comportamiento del Sistema</h3>
          <div class="apple-form">
            
            <div class="form-group checkbox-group">
              <input type="checkbox" id="setting-resume-music">
              <label for="setting-resume-music">Reanudar la reproducción automáticamente al iniciar</label>
            </div>

            <div class="form-group checkbox-group">
              <input type="checkbox" id="setting-tray-icon">
              <label for="setting-tray-icon">Habilitar icono en la barra de tareas (Tray Icon)</label>
            </div>

            <div class="form-group checkbox-group">
              <input type="checkbox" id="setting-close-to-tray" id="opt-close-tray" disabled>
              <label for="setting-close-to-tray">Al pulsar (✕), minimizar en segundo plano en vez de salir</label>
            </div>

            <div class="form-group checkbox-group">
              <input type="checkbox" id="setting-show-notifications">
              <label for="setting-show-notifications">Mostrar una notificación al cambiar de canción</label>
            </div>

            <div class="form-group" style="margin-top: 10px;">
              <label for="setting-start-window">Modo de inicio de la ventana</label>
              <select id="setting-start-window" class="apple-select">
                <option value="windowed">Ventana normal</option>
                <option value="maximized">Maximizado</option>
                <option value="minimized" id="opt-start-minimized" disabled>Minimizado (Requiere Tray Icon)</option>
              </select>
            </div>

          </div>
        </div>

        <div class="settings-card">
          <h3>Actualizaciones de Software</h3>
          <p id="updater-status">Estado: Listo para buscar actualizaciones.</p>
          <div id="updater-actions">
            <button id="btn-check-update" class="apple-btn-primary">Comprobar actualizaciones</button>
          </div>
        </div>
      </section>

    </main>
  </div>

  <footer class="player-bar">
    <div class="player-info">
      <div id="player-track-title">Ninguna canción seleccionada</div>
      <div id="player-track-source" style="font-size: 11px; opacity: 0.6;">---</div>
    </div>
    
    <div class="player-controls-container">
      <div class="player-buttons">
        <button id="btn-prev" class="control-btn" title="Anterior">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6L18 6v12z"/></svg>
        </button>
        <button id="btn-play" class="control-btn play-main" title="Reproducir/Pausa">
          <svg id="svg-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="btn-next" class="control-btn" title="Siguiente">
          <svg viewBox="0 0 24 24"><path d="M6 18V6l8.5 6zm11-12h2v12h-2z"/></svg>
        </button>
      </div>
      
      <div class="progress-container">
        <span id="time-current">0:00</span>
        <div class="slider-wrapper">
          <input type="range" id="progress-bar" value="0" max="100">
        </div>
        <span id="time-total">0:00</span>
      </div>
    </div>
    
    <div class="player-volume">
      <span class="volume-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </span>
      <input type="range" id="volume-bar" value="80" max="100">
    </div>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
